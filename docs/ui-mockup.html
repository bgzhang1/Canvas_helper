<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas_helper · UI Mockup (墨刀导入参考)</title>
<style>
  :root{--bg:#F4F4F0;--ink:#000;--p2:#E8E8E3;--mut:#6b7280;--mut2:#9ca3af}
  *{box-sizing:border-box}
  body{margin:0;background:#dcdcd6;color:#000;padding:0 40px 40px;display:flex;flex-direction:column;align-items:center;
    font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
  .switcher{position:sticky;top:0;z-index:100;width:100%;background:#000;display:flex;flex-wrap:wrap;gap:6px;
    padding:10px 14px;margin:0 -40px 32px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .switcher button{background:var(--bg);color:#000;border:1px solid var(--bg);cursor:pointer;
    font:700 11px/1 ui-monospace,monospace;letter-spacing:.06em;padding:8px 12px}
  .switcher button:hover{background:#000;color:var(--bg)}
  .switcher button.on{background:#000;color:var(--bg)}
  .board{display:none;flex-direction:column;align-items:center}
  .board.on{display:flex}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .cap{align-self:flex-start;width:1440px;margin:0 auto -36px;font:700 13px/1 ui-monospace,monospace;letter-spacing:.2em;color:#000;text-transform:uppercase}
  .frame{width:1440px;height:900px;background:var(--bg);border:1px solid #000;display:flex;overflow:hidden;position:relative;
    box-shadow:10px 10px 0 rgba(0,0,0,.16)}
  .grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.04;
    background-image:radial-gradient(circle at 1px 1px,#000 1px,transparent 0);background-size:32px 32px}
  /* sidebar */
  .sb{width:288px;border-right:1px solid #000;display:flex;flex-direction:column;flex:0 0 auto;background:var(--bg);z-index:2}
  .sb-logo{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#000;color:var(--bg);
    font:700 18px/1 ui-monospace,monospace;letter-spacing:.18em}
  .sb-sec{font:700 10px/1 ui-monospace,monospace;letter-spacing:.2em;color:var(--mut);padding:0 8px;margin:0 0 16px}
  .sb-nav{padding:32px 16px}
  .nav-btn{width:100%;display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid transparent;background:none;
    font:500 14px/1 Inter,sans-serif;letter-spacing:.02em;color:#000;cursor:pointer;text-align:left;margin-bottom:8px}
  .nav-btn:hover{border-color:#000}
  .nav-btn.on{background:#000;color:var(--bg);border-color:#000}
  .sb-terms{padding:16px;flex:1;overflow:auto}
  .term-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font:700 10px/1 ui-monospace,monospace;
    letter-spacing:.18em;color:#4b5563}
  .term-row .l{display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;background:#000;border-radius:50%}
  .course-li{width:100%;display:flex;align-items:center;gap:12px;padding:8px 16px;border:1px solid transparent;
    font:400 14px/1 ui-monospace,monospace;letter-spacing:.04em;color:#000;cursor:pointer;background:none;margin-top:4px}
  .course-li:hover{border-color:#000}
  .course-li.on{border-color:#000;background:var(--p2);font-weight:700}
  .sq{width:6px;height:6px;background:#000}.sq.idle{background:var(--mut2)}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;z-index:1}
  .hd{min-height:64px;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}
  .crumb{display:flex;align-items:center;gap:12px;font:400 12px/1 ui-monospace,monospace;letter-spacing:.18em}
  .crumb b{font-weight:700}
  .crumb-link{background:none;border:0;font:inherit;color:#000;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:4px}
  .hd-r{display:flex;align-items:center;gap:16px}
  .btn-o{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid #000;background:var(--bg);
    font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
  .btn-k{display:inline-flex;align-items:center;gap:8px;padding:6px 20px;border:1px solid #000;background:#000;color:var(--bg);
    font:700 12px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
  .search{position:relative;display:flex;align-items:center;border:1px solid #000;background:var(--bg)}
  .search input{border:0;background:none;outline:none;padding:8px 16px 8px 34px;width:256px;
    font:400 12px/1 ui-monospace,monospace;color:#000}
  .search svg{position:absolute;left:11px}
  .content{flex:1;overflow:auto;padding:48px;position:relative}
  /* badges */
  .bdg{display:inline-block;padding:2px 8px;border:1px solid #000;font:400 10px/1.4 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
  .bdg.inv{background:#000;color:var(--bg)}
  .bdg.warn{text-decoration:underline wavy}
  /* dashboard */
  .wrap{max-width:1152px;margin:0 auto}
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #000;padding-bottom:24px;margin-bottom:48px}
  .dash-title{font:800 48px/1 Inter,sans-serif;letter-spacing:-.03em;margin:0 0 16px}
  .dash-sub{font:400 14px/1.4 ui-monospace,monospace;color:var(--mut);margin:0}
  .term-banner{display:flex;align-items:center;justify-content:space-between;border:1px solid #000;background:#000;color:var(--bg);
    padding:12px 24px;margin-bottom:24px}
  .term-banner .nm{font:700 14px/1 ui-monospace,monospace;letter-spacing:.18em}
  .term-banner .r{display:flex;align-items:center;gap:12px}
  .term-banner .cnt{font:400 11px/1 ui-monospace,monospace;letter-spacing:.18em;color:#d1d5db}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{border:1px solid #000;background:var(--bg);padding:32px;cursor:pointer;position:relative;transition:.15s}
  .card:hover{background:#000;color:var(--bg)}
  .card:hover .card-name,.card:hover .card-foot{color:#d1d5db}
  .card:hover .card-foot{border-color:var(--bg)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px}
  .card-bdgs{display:flex;gap:8px}
  .card-no{font:800 30px/1 Inter,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
  .card-name{font:500 14px/1.4 Inter,sans-serif;color:var(--mut);margin:0 0 48px}
  .card-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #000;padding-top:16px;
    font:400 11px/1 ui-monospace,monospace}
  .card-foot .l{display:flex;align-items:center;gap:8px}
  /* course detail */
  .cd-title{font:800 60px/1 Inter,sans-serif;letter-spacing:-.03em;margin:0}
  .cd-head{border-bottom:1px solid #000;padding-bottom:32px;margin-bottom:48px}
  .cd-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:16px}
  .cd-left{display:flex;align-items:center;gap:16px}
  .cd-meta{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .cd-desc{font:500 20px/1.4 Inter,sans-serif;color:var(--mut);margin:24px 0 0}
  .tabs{display:flex;gap:32px;border-bottom:1px solid #000;margin-bottom:32px}
  .tab{display:flex;align-items:center;gap:8px;padding-bottom:16px;background:none;border:0;cursor:pointer;position:relative;
    font:700 12px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mut2)}
  .tab.on{color:#000}
  .tab.on::after{content:"";position:absolute;left:0;bottom:-1px;width:100%;height:2px;background:#000}
  .tl-item{border:1px solid #000;padding:20px 24px;margin-bottom:16px;display:flex;gap:20px;align-items:flex-start;background:var(--bg)}
  .tl-date{font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.1em;min-width:120px}
  .tl-body h4{margin:0 0 6px;font:700 16px/1.3 Inter,sans-serif}
  .tl-body p{margin:0;font:400 13px/1.4 Inter,sans-serif;color:var(--mut)}
  /* tables & file/list content */
  .toolbar{display:flex;justify-content:space-between;align-items:center;background:var(--p2);border:1px solid #000;padding:16px;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .mount{display:flex;align-items:center;gap:8px;font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.12em;color:#4b5563;text-transform:uppercase}
  .mount b{color:#000}
  .tbl{width:100%;border:1px solid #000;background:#fff;border-collapse:collapse}
  .tbl th{font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;text-align:left;padding:16px;border-bottom:1px solid #000;background:var(--bg)}
  .tbl td{padding:16px;border-bottom:1px solid #000;font:500 14px/1.4 Inter,sans-serif;vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .fn{font-weight:700}.fmeta{font:400 10px/1 ui-monospace,monospace;color:var(--mut);margin-top:4px}
  .dirrow td{background:var(--p2);font:700 12px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;padding:6px;border:1px solid #000;background:#fff;cursor:pointer}
  .minibtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #000;background:#fff;
    font:700 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .acts{display:flex;justify-content:flex-end;gap:8px}
  /* accordion */
  .acc{border:1px solid #000;background:var(--bg)}
  .acc-item{border-bottom:1px solid #000}.acc-item:last-child{border-bottom:0}
  .acc-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px}
  .acc-hd h3{margin:0;font:700 18px/1.3 Inter,sans-serif;text-transform:uppercase}
  .acc-hd .meta{font:400 10px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;margin-top:8px}
  .date-chip{font:400 11px/1 ui-monospace,monospace;background:#000;color:var(--bg);padding:5px 8px;white-space:nowrap}
  .chev{width:28px;height:28px;border:1px solid #000;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .acc-body{border-top:1px solid #000;background:#fff;padding:20px;font:400 14px/1.6 Inter,sans-serif}
  .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .dcell{border:1px solid #000;background:#fff;padding:12px}
  .dcell .k{font:700 10px/1 ui-monospace,monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
  .dcell .v{font:700 13px/1.3 Inter,sans-serif}
  /* timeline */
  .tl-sub{font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--mut);margin:0 0 8px}
  .tline{border-left:1px solid #000;margin-left:16px;padding:16px 0;display:flex;flex-direction:column;gap:40px}
  .tnode{position:relative;padding-left:32px}
  .tnode .pt{position:absolute;left:-6px;top:24px;width:12px;height:12px;border:1px solid #000;background:var(--bg)}
  .tnode .pt.fill{background:#000}
  .tcard{border:1px solid #000;padding:24px;background:var(--bg)}
  .tcard .th{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
  .tcard h3{margin:0;font:700 18px/1.3 Inter,sans-serif}
  .tcard .src{font:500 13px/1.4 Inter,sans-serif;color:var(--mut);margin:0 0 20px}
  .badges{display:flex;gap:12px;flex-wrap:wrap}
  /* modal */
  .modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:40px;z-index:5}
  .modal{width:100%;max-width:920px;height:640px;background:var(--bg);border:1px solid #000;display:flex;flex-direction:column;box-shadow:16px 16px 0 #000}
  .modal-hd{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #000;background:#000;color:var(--bg);
    font:700 14px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
  .modal-bd{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--mut);font:400 13px/1 ui-monospace,monospace}
  /* toggle + rows */
  .toggle{width:44px;height:24px;border:1px solid #000;background:#000;position:relative;flex:0 0 auto}
  .toggle::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;background:var(--bg)}
  .toggle.off{background:var(--bg)}
  .toggle.off::after{right:auto;left:2px;background:#000}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .set-label{font:700 13px/1 Inter,sans-serif}
  /* agent */
  .agent{display:flex;height:100%;border:1px solid #000}
  .ag-side{width:280px;border-right:1px solid #000;display:flex;flex-direction:column;flex:0 0 auto}
  .ag-side-hd{padding:16px;border-bottom:1px solid #000;font:700 11px/1 ui-monospace,monospace;letter-spacing:.18em;
    display:flex;justify-content:space-between;align-items:center}
  .conv{padding:14px 16px;border-bottom:1px solid #000;cursor:pointer;font:400 13px/1.3 Inter,sans-serif}
  .conv.on{background:var(--p2);font-weight:700}
  .conv small{display:block;color:var(--mut);font:400 10px/1 ui-monospace,monospace;letter-spacing:.1em;margin-top:6px}
  .ag-main{flex:1;display:flex;flex-direction:column;min-width:0}
  .ag-msgs{flex:1;overflow:auto;padding:32px;display:flex;flex-direction:column;gap:20px}
  .msg{max-width:78%}
  .msg .who{font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--mut);margin-bottom:8px}
  .bubble{border:1px solid #000;padding:14px 18px;font:400 14px/1.5 Inter,sans-serif}
  .msg.me{align-self:flex-end;text-align:right}
  .msg.me .bubble{background:#000;color:var(--bg);text-align:left}
  .think{border:1px dashed #000;background:var(--p2);padding:12px 16px;margin-top:10px;
    font:400 12px/1.5 ui-monospace,monospace;color:#374151}
  .tool{border:1px solid #000;padding:10px 14px;margin-top:10px;font:400 11px/1.4 ui-monospace,monospace;
    display:flex;align-items:center;gap:8px;letter-spacing:.04em}
  .ag-compose{border-top:1px solid #000;padding:16px;display:flex;gap:12px}
  .ag-compose input{flex:1;border:1px solid #000;background:var(--bg);padding:12px 16px;outline:none;
    font:400 14px/1 Inter,sans-serif}
  /* settings */
  .set-grid{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
  .panel{border:1px solid #000;background:var(--bg)}
  .panel-hd{background:#000;color:var(--bg);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
    font:700 12px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
  .panel-bd{padding:24px;display:flex;flex-direction:column;gap:18px}
  .field label{display:block;font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--mut);margin-bottom:8px}
  .field input,.field select{width:100%;border:1px solid #000;background:var(--bg);padding:11px 14px;outline:none;
    font:400 13px/1 ui-monospace,monospace}
  .note{font:400 12px/1.5 ui-monospace,monospace;color:var(--mut)}
  .seg{display:flex;border:1px solid #000;width:max-content}
  .seg span{padding:8px 18px;font:700 11px/1 ui-monospace,monospace;letter-spacing:.12em;border-right:1px solid #000}
  .seg span:last-child{border-right:0}
  .seg span.on{background:#000;color:var(--bg)}
</style>
</head>

    btn.onclick=()=>show(i);
    nav.appendChild(btn);
  });

  let cur=0;
  function show(i){
    cur=(i+boards.length)%boards.length;

    [...nav.children].forEach((c,j)=>c.classList.toggle('on',j===cur));

  });
